# Konfigurasi Fly.io. Ganti `app` dengan nama unik (huruf kecil, angka, strip).
app = "photobooth-informatika-6"
primary_region = "sin" # Singapura, paling dekat dengan Indonesia

[build]

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  DATA_DIR = "/data"

# Foto, antrean upload, dan token Drive disimpan di sini. Volume terikat ke SATU mesin.
[mounts]
  source = "photobooth_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Server menyimpan state sesi di memori: harus selalu menyala, satu mesin saja, jangan di-scale.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
